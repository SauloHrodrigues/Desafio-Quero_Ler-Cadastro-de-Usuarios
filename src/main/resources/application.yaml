spring:
  profiles:
    active: dev
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    clean-disabled: false
    baseline-on-migrate: false
    #    clean-on-validation-error: true
    locations: classpath:db/migration
api:
  securit:
    token:
      secret=${JWT_SECRET:my-secret-key}: